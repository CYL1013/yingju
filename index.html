<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影聚</title>
<meta name="theme-color" content="#F6F3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="影聚">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&display=swap">
<style>
/* Layout: 無印風 — 米白底、白色卡片、細線分隔，照片放在白色裱框裡；只用暖灰與一點酒紅做強調 */
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --soft:#EFEBE2; --ink:#3E3A35; --muted:#8F8A80; --line:#E3DED3;
  --accent:#7F0019; --gold:#B9A16B; --silver:#A6A49E; --bronze:#A98667; --ok:#5E7A5B; --danger:#9C3B3B;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;font-weight:400;letter-spacing:.02em}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding-block:40px 64px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--sans);text-wrap:balance;margin:0;line-height:1.4;font-weight:400;letter-spacing:.08em}
h1{font-size:clamp(24px,4.4vw,32px);font-weight:300;letter-spacing:.14em}
h2{font-size:18px}
h3{font-size:15px;font-weight:500}
p{margin:0}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.06em}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.strip{display:none}

/* header */
header{display:grid;gap:12px;padding-bottom:4px}
.eyebrow{font-size:12px;letter-spacing:.24em;color:var(--muted)}
.themes{display:flex;flex-wrap:wrap;gap:8px 18px}
.chip{display:inline-flex;align-items:baseline;gap:10px;font-size:14px;color:var(--ink)}
.chip b{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.1em}
.chip b::after{content:"／";margin-left:2px;color:var(--line)}
.steps{display:flex;gap:0;flex-wrap:wrap;font-size:12px;letter-spacing:.12em}
.step{color:var(--muted);padding:2px 0}
.step+.step::before{content:"—";margin:0 10px;color:var(--line)}
.step.on{color:var(--accent);font-weight:500}
.step.done{color:var(--ink)}
.deadline{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--muted)}
.deadline .left{color:var(--ink);font-weight:500}
.deadline .left.over{color:var(--danger)}

nav.tabs{display:flex;gap:2px;margin:28px 0 28px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:inherit;font-size:14px;letter-spacing:.12em;background:none;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;padding:10px 16px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label.btn:focus-within{outline:1px solid var(--ink);outline-offset:3px}

.panel{background:var(--surface);border:1px solid var(--line);padding:24px;display:grid;gap:16px}
.stack{display:grid;gap:28px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{padding:16px 20px;background:var(--soft);color:var(--ink);display:grid;gap:6px;font-size:14px}
.notice.warn{background:transparent;border:1px solid var(--line)}
.notice h3{font-size:15px}
.btn{font:inherit;font-size:14px;letter-spacing:.1em;cursor:pointer;border-radius:0;padding:9px 20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.btn.wide{width:100%;padding:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=datetime-local],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:9px 12px;width:100%;min-width:0}
label.field{display:grid;gap:6px;font-size:13px;color:var(--muted);min-width:0;letter-spacing:.06em}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
textarea{font:inherit;font-size:13px;width:100%;min-width:0;resize:vertical;border-radius:0;padding:8px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);line-height:1.6}
textarea::placeholder,input::placeholder{color:#B5AFA4}

/* photo frames — white mats */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.frame{background:var(--surface);border:1px solid var(--line);padding:12px 12px 10px;display:grid;gap:8px;color:var(--ink);min-width:0;align-content:start}
.frame .pic{aspect-ratio:3/2;max-width:100%;display:grid;place-items:center;background:var(--soft);overflow:hidden;cursor:zoom-in;border:0;padding:0;width:100%;position:relative}
.frame .pic img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;display:block}
.frame .pic.empty{cursor:default;background:var(--bg);border:1px dashed var(--line);color:var(--muted);font-size:13px;letter-spacing:.1em}
.frame .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;min-height:26px;color:var(--muted);letter-spacing:.1em}
.frame .cap .who{font-size:14px;color:var(--ink);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame.mine{opacity:.45}
.frame.picked{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ranks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ranks button{font:inherit;font-size:13px;padding:5px 0;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.ranks button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.tag{font-size:11px;padding:1px 8px;background:var(--soft);color:var(--muted);letter-spacing:.08em}
.slot-actions{display:flex;gap:6px}
.slot-actions label.btn{font-size:12px;padding:4px 12px}
.slot-actions input{position:absolute;width:1px;height:1px;opacity:0}
.note{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.saved{font-size:12px;color:var(--ok)}
details.cm{font-size:13px;color:var(--ink)}
details.cm summary{cursor:pointer;color:var(--muted);letter-spacing:.06em}
details.cm ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
details.cm li{white-space:pre-wrap;overflow-wrap:anywhere}

.ballot{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted)}
.ballot span b{color:var(--ink);font-weight:500;letter-spacing:.08em}
.votebar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* results */
.podium{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.medal{font-size:14px;letter-spacing:.12em;display:flex;align-items:center;gap:10px;color:var(--ink)}
.medal i{font-style:normal;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;color:#FFFFFF}
.m1 i{background:var(--gold)} .m2 i{background:var(--silver)} .m3 i{background:var(--bronze)}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.12em}
.tablewrap{overflow-x:auto}
.ok{color:var(--ok)}

/* draw wheels */
.wheels{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.wheel-card{align-content:start}
.wheel-card .cur{font-weight:500;color:var(--ink)}
.wheel-wrap{position:relative;display:grid;place-items:center;padding-top:14px;max-width:300px;width:100%;margin:0 auto}
.wheel{display:block;border-radius:50%;box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--line)}
.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid var(--accent);z-index:1}
.pick{text-align:center;font-size:15px;letter-spacing:.1em;min-height:1.75em}
.pick b{font-weight:500;color:var(--accent)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(246,243,236,.97);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox{cursor:zoom-out;overflow:auto;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:calc(100vh - 96px);width:auto;height:auto;cursor:zoom-in;background:var(--surface);padding:10px;border:1px solid var(--line)}
.lightbox.full{display:block;text-align:center}
.lightbox.full img{max-width:none;max-height:none;cursor:zoom-out}
.lb-bar{position:fixed;z-index:2;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.lb-btn{font:inherit;font-size:13px;letter-spacing:.1em;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:7px 14px;cursor:pointer}
.show{background:var(--bg);color:var(--ink);grid-template-rows:1fr auto;place-items:stretch;user-select:none}
.show .stage{display:grid;place-items:center;min-height:0;text-align:center;gap:18px;padding:12px}
.show .stage img{max-height:70vh;background:var(--surface);padding:12px;border:1px solid var(--line)}
.show .big{font-weight:300;font-size:clamp(28px,5.4vw,56px);line-height:1.3;letter-spacing:.16em}
.show .sub{font-size:clamp(15px,2.2vw,22px);color:var(--muted);letter-spacing:.1em}
.show .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.show .bar button{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:6px 14px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#FFFFFF;padding:10px 18px;font-size:14px;letter-spacing:.06em;max-width:calc(100% - 32px)}
.meter{height:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.exif{font-size:12px;color:var(--muted);letter-spacing:.04em;line-height:1.6;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.6}
.check input{margin-top:4px;accent-color:var(--ink);width:16px;height:16px;flex:none}
.link{font:inherit;font-size:13px;letter-spacing:.1em;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;justify-self:start}
.link:hover{color:var(--ink)}
.events{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.event{font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:1px solid var(--line);padding:18px;display:grid;gap:12px;cursor:pointer;align-content:start;min-width:0}
.event:hover{border-color:var(--muted)}
.ev-head{display:grid;gap:2px}
.ev-title{font-size:16px;letter-spacing:.1em}
.ev-date{font-size:12px;color:var(--muted);letter-spacing:.08em}
.ev-themes{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px}
.ev-themes b{font-weight:500;color:var(--muted);font-size:11px;margin-right:6px;letter-spacing:.1em}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumb{position:relative;aspect-ratio:1;background:var(--soft);overflow:hidden;display:block}
.thumb img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.thumb i{position:absolute;left:4px;top:4px;font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#FFFFFF}
.thumb i.m1{background:var(--gold)} .thumb i.m2{background:var(--silver)} .thumb i.m3{background:var(--bronze)}
.thumb em{position:absolute;right:4px;bottom:3px;font-style:normal;font-size:10px;color:#FFFFFF;text-shadow:0 0 3px rgba(0,0,0,.5);letter-spacing:.08em}
.ev-names{font-size:13px;color:var(--ink);line-height:1.7}
.ev-names span{color:var(--muted);font-size:12px;margin-right:8px;letter-spacing:.1em}
/* 手機：鎖住橫向捲動；輸入框至少 16px，避免 iPhone 點輸入框時自動放大 */
html{overflow-x:hidden}
body{max-width:100%;overflow-x:clip}
body{position:relative}
.wrap{overflow-wrap:anywhere}
img,canvas,table{max-width:100%}
@media (max-width:640px){input,textarea,select{font-size:16px!important}}
.pic.busy{font-size:13px;color:var(--ink);text-align:center;padding:0 12px;line-height:1.6}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--surface);justify-self:start}
.seg button{font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:0;padding:8px 16px;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--ink);color:#FFFFFF}
.wc-label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.name-link{font:inherit;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
.name-link:hover{border-bottom-color:var(--ink)}
.frame .cap .who.name-link{font-size:14px;letter-spacing:.06em;max-width:100%}
table.board td{font-size:14px}
table.board tr.top td:first-child{color:var(--accent);font-weight:500}
a.btn{text-decoration:none}
.ev-row{display:grid;gap:8px}
.ev-row+.ev-row{padding-top:12px;border-top:1px solid var(--line)}
.ev-theme{font-size:13px;letter-spacing:.06em}
.ev-theme b{font-weight:500;color:var(--muted);font-size:11px;margin-right:8px;letter-spacing:.1em}
.tcell{display:grid;gap:4px;min-width:0}
.tname{font-size:12px;text-align:center;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.04em}
.ev-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:-8px}
.ev-bar-info{display:grid;gap:4px;min-width:0}
.ev-bar-info h2{font-size:17px}
.jumps{display:flex;flex-wrap:wrap;gap:8px}
.jump{font:inherit;font-size:13px;letter-spacing:.06em;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:7px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:baseline;max-width:100%}
.jump b{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.1em}
.jump[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.jump[aria-current="true"] b{color:#D9D3C7}
@media (max-width:640px){.ev-bar{padding:10px 0}.ev-bar-info h2{font-size:16px}.jump{padding:6px 12px}}
.theme-sec{align-content:start}
.theme-sec:last-of-type{min-height:calc(100vh - 140px)}
/* ===== 介面加強：可點元素更醒目、區塊分明 ===== */
:root{--line-strong:#C9C0AF;--ink-soft:#5E584F}
header{gap:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--ink-soft)}
.brand{letter-spacing:.3em;font-size:13px;color:var(--ink)}
.who-am-i{display:inline-flex;align-items:center;gap:10px}
.btn.sm{padding:4px 12px;font-size:12px}
.head-card{background:var(--surface);border:1px solid var(--line);padding:28px 24px 22px;display:grid;gap:18px;text-align:center;justify-items:center}
.head-card .eyebrow{letter-spacing:.3em}
.head-card h1{margin-top:-8px}
.theme-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.tcard{background:var(--bg);border:1px solid var(--line);padding:16px 10px 14px;display:grid;gap:4px;align-content:start;min-width:0}
.tcard .tl{font-size:11px;letter-spacing:.24em;color:var(--muted)}
.tcard .tn{font-size:clamp(18px,4.2vw,22px);letter-spacing:.14em;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.tcard .td{font-size:12px;color:var(--ink-soft);line-height:1.6}
.progress{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
.pstep{position:relative;display:grid;justify-items:center;gap:4px;padding:0 4px;min-width:0}
.pstep::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:2px;background:var(--line);z-index:0}
.pstep:first-child::before{display:none}
.pstep.done::before,.pstep.on::before{background:var(--ink)}
.dot{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pstep.done .dot{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.pstep.on .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px rgba(127,0,25,.10);font-weight:500}
.plabel{font-size:14px;letter-spacing:.16em;color:var(--ink-soft)}
.pstep.on .plabel{color:var(--accent);font-weight:500}
.pdate{font-size:11px;color:var(--muted);letter-spacing:.02em;line-height:1.5}
.pnote{font-size:13px;color:var(--ink-soft);background:var(--bg);padding:8px 16px;border:1px solid var(--line)}
.pnote b{color:var(--ink);font-weight:500;margin-left:8px}
.pnote .over{color:var(--danger)}
/* 分頁 */
nav.tabs{justify-content:safe center;gap:4px;margin:22px 0 26px;border-bottom:1px solid var(--line-strong)}
nav.tabs button{color:var(--ink-soft);border-bottom-width:2px}
nav.tabs button:hover{color:var(--ink);background:var(--soft)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
/* 可點的東西 */
.btn{border-color:var(--line-strong)}
.btn:hover:not(:disabled){border-color:var(--ink-soft);background:var(--soft)}
.btn.primary:hover:not(:disabled){background:#2E2B27;border-color:#2E2B27}
.slot-actions label.btn{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.ranks button{border-color:var(--line-strong);color:var(--ink)}
.ranks button:hover{background:var(--soft)}
.link{color:var(--ink-soft);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line-strong)}
.name-link{border-bottom-color:var(--ink-soft)}
.jump,.seg,.lb-btn{border-color:var(--line-strong)}
.jump:not([aria-current="true"]):hover,.seg button:not([aria-selected="true"]):hover{background:var(--soft)}
.event{border-color:var(--line-strong)}
.event:hover{border-color:var(--ink-soft);box-shadow:0 2px 0 var(--line)}
input[type=text],input[type=datetime-local],select,textarea{border-color:var(--line-strong)}
details.cm summary{color:var(--ink-soft)}
.frame{border-color:var(--line-strong)}
.notice{border:1px solid var(--line)}
@media (max-width:420px){.head-card{padding:22px 14px 18px}.plabel{font-size:13px;letter-spacing:.1em}.pdate{font-size:10px}}
/* 分頁列：不捲動（目前分頁都放得下），手機上平均分配寬度 */
nav.tabs{overflow:visible;flex-wrap:nowrap}
nav.tabs button{margin-bottom:-1px;flex:0 0 auto}
@media (max-width:640px){
  nav.tabs{justify-content:stretch;gap:0}
  nav.tabs button{flex:1 1 0;min-width:0;padding:10px 2px;letter-spacing:.06em;font-size:14px;text-align:center}
}
/* 日期時間欄位：iPhone 預設會撐寬、置中、變高，統一成跟其他輸入框一樣 */
input[type=text],input[type=datetime-local],select{height:46px;line-height:1.4;box-sizing:border-box}
input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;text-align:left;background-clip:padding-box}
input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=datetime-local]::-webkit-datetime-edit{padding:0}
label.field>input,label.field>select,label.field>textarea{max-width:100%;min-width:0}
/* 開新一期 */
.theme-cards.single{grid-template-columns:1fr;max-width:300px}
.tcard .tn.tbd{color:var(--muted);font-weight:400}
.warn-text{color:var(--danger);margin-left:6px}
.next-panel h2{margin-bottom:2px}
.next-panel.confirm{border-color:var(--ink-soft);box-shadow:0 0 0 1px var(--ink-soft)}
details.rules{display:block}
details.rules>summary{cursor:pointer;list-style:none;display:grid;gap:2px}
details.rules>summary::-webkit-details-marker{display:none}
details.rules>summary h2::after{content:"＋";float:right;color:var(--ink-soft);font-weight:300}
details.rules[open]>summary h2::after{content:"－"}
details.rules[open]>summary{margin-bottom:16px}
details.rules>*:not(summary){margin-top:14px}
.sched{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:12px}
input[type=time]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);border-radius:0;padding:9px 12px;width:100%;min-width:0;height:46px;box-sizing:border-box;-webkit-appearance:none;appearance:none;text-align:left}
textarea.msg{font-size:14px;line-height:1.7;background:var(--bg)}
.member-chips{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,120px),1fr))}
.member-chip{font:inherit;font-size:15px;letter-spacing:.08em;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);padding:14px 10px;cursor:pointer;text-align:center;overflow-wrap:anywhere}
.member-chip:hover{border-color:var(--ink-soft);background:var(--soft)}
.note-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.note-status{font-size:12px;color:var(--muted);letter-spacing:.04em}
/* ===== 分頁列固定置頂 ===== */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);margin-top:22px;margin-bottom:26px}
.ev-bar{top:calc(env(safe-area-inset-top,0px) + var(--tabs-h,48px))}
/* ===== 投票：主題切換與置頂的名次欄 ===== */
.vote-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tabs-h,48px));z-index:20;background:var(--bg);display:grid;gap:10px;padding:10px 0 12px;border-bottom:1px solid var(--line-strong);margin-top:-14px}
.vt-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vt-switch button{font:inherit;font-size:14px;letter-spacing:.06em;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);padding:9px 10px;cursor:pointer;display:flex;align-items:baseline;justify-content:center;gap:8px;min-width:0}
.vt-switch button b{font-weight:500;color:var(--muted);font-size:11px}
.vt-switch button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.vt-switch button[aria-pressed="true"] b{color:#D9D3C7}
.vt-switch button:not([aria-pressed="true"]):hover{background:var(--soft)}
.vt-count{font-size:12px;font-variant-numeric:tabular-nums;opacity:.8}
.vt-count.full::after{content:" ✓"}
.vt-head{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.vt-title{font-size:16px;letter-spacing:.1em}
.vt-title b{font-weight:500;color:var(--muted);font-size:12px;margin-right:8px}
.vt-desc{font-size:12px;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{font:inherit;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);padding:5px;min-width:0;color:var(--ink);text-align:left}
button.slot{cursor:pointer}
button.slot:hover{border-color:var(--ink-soft)}
.slot:not(.filled){border-style:dashed;background:transparent}
.sthumb{position:relative;width:44px;height:44px;flex:none;background:var(--soft);overflow:hidden;display:block}
.sthumb img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.sthumb i{position:absolute;left:2px;top:2px;font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#FFFFFF}
.sthumb.empty i{left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;font-size:12px}
.sthumb i.m1{background:var(--gold)} .sthumb i.m2{background:var(--silver)} .sthumb i.m3{background:var(--bronze)}
.scode{font-size:12px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.on{background:var(--ink);color:#FFFFFF}
.vt-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px}
.frame[id^="card_"]{scroll-margin-top:200px}
@media (max-width:420px){.sthumb{width:36px;height:36px}.slot{gap:6px;padding:4px}.scode{font-size:11px}}
/* 投票置頂欄：每個主題按鈕下面直接放它的三個名次 */
.vt-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vt-cols.single{grid-template-columns:minmax(0,360px)}
.vt-col{display:grid;gap:6px;min-width:0}
.vt-btn{font:inherit;font-size:14px;letter-spacing:.06em;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);padding:8px 8px;cursor:pointer;display:flex;align-items:baseline;justify-content:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.vt-btn b{font-weight:500;color:var(--muted);font-size:11px}
.vt-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.vt-btn[aria-pressed="true"] b{color:#D9D3C7}
.vt-btn:not([aria-pressed="true"]):hover{background:var(--soft)}
.vt-cols .slots{gap:5px}
.vt-cols .slot{flex-direction:column;align-items:stretch;gap:3px;padding:3px}
.vt-cols .sthumb{width:100%;height:auto;aspect-ratio:1}
.vt-cols .scode{text-align:center;font-size:11px}
.vt-cols .sthumb.empty i{width:20px;height:20px;font-size:11px}
@media (min-width:760px){.vt-cols .sthumb{aspect-ratio:auto;height:72px}}
/* ===== 登入／註冊 ===== */
.auth{display:grid;justify-items:center;padding:4px 0 24px}
.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line-strong);padding:32px 28px 28px;display:grid;gap:12px;text-align:center}
.auth-card h2{font-size:20px;letter-spacing:.2em;font-weight:400}
.auth-card>p{line-height:1.8}
.auth-form{display:grid;gap:16px;text-align:left;margin-top:8px}
.auth-form input[type=text]{height:50px;font-size:17px;letter-spacing:.08em}
.auth-form #code{text-align:center;font-size:22px;letter-spacing:.4em}
.auth-form #code::placeholder{font-size:14px;letter-spacing:.04em}
.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.auth-actions .btn{width:100%;padding:12px 8px}
.auth-mark{width:56px;height:56px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;margin:0 auto 4px;font-size:20px;color:var(--ink-soft);background:var(--bg)}
.confirm-list{margin:8px 0 0;display:grid;gap:0;text-align:left;border-top:1px solid var(--line)}
.confirm-list div{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.confirm-list dt{color:var(--muted);font-size:13px;letter-spacing:.1em}
.confirm-list dd{margin:0;font-size:16px;letter-spacing:.08em}
@media (max-width:420px){.auth-card{padding:26px 18px 22px}}
/* ===== 審核新成員 ===== */
.applicants{border-color:var(--accent);box-shadow:0 0 0 1px rgba(127,0,25,.25)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:#FFFFFF;font-size:12px;letter-spacing:0;vertical-align:middle;margin-left:6px}
.ap-list{display:grid;border-top:1px solid var(--line)}
.ap-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ap-info{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;min-width:0}
.ap-info b{font-weight:500;font-size:15px;letter-spacing:.06em}
.ap-btns{display:flex;gap:8px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.tab-dot{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#FFFFFF;font-size:10px;letter-spacing:0;margin-left:4px;vertical-align:top}
</style>
